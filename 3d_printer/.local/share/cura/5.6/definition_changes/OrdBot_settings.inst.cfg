[general]
version = 4
name = OrdBot_settings
definition = custom

[metadata]
type = definition_changes
setting_version = 22

[values]
extruders_enabled_count = 1
machine_depth = 200
machine_end_gcode = M104 S0
	M140 S0
	;Retract the filament
	G92 E1
	G1 E-1 F300
	G1 X0 Y200
	M84
machine_heated_bed = True
machine_height = 500.0
machine_start_gcode = ;G28 ;Home
	;G1 Z15.0 F6000 ;Move the platform down 15mm
	;Prime the extruder
	;G92 E0
	;G1 F200 E3
	;G92 E0
	
	 ; Custom Start G-code
	G28 ; Home all axes
	G92 E0 ; Reset Extruder
	G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
	G1 X10 Y4.0 Z0.3 F5000.0 ; Move to start position
	G1 X200 Y4.0 Z0.3 F1500.0 E15 ; Draw the first line
	G1 X200 Y3.7 Z0.3 F5000.0 ; Move to side a little
	G1 X10 Y3.7 Z0.3 F1500.0 E30 ; Draw the second line
	G92 E0 ; Reset Extruder
	G1 Z5.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed and let out nozzle pressure
	G1 X0 Y15 Z0.0; Move back to heat bed, sticking blob of filament down before travel move to free nozzle
	; End of custom start GCode
machine_use_extruder_offset_to_offset_coords = False
machine_width = 200

